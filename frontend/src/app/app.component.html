<div class="p-6">
  <!-- Utilisation simple du pipe -->
  <h1 class="text-2xl font-bold">{{ 'WELCOME' | translate }}</h1>

  <!-- Utilisation avec un objet imbriqué -->
  <p class="text-gray-600">{{ 'HOME.DESCRIPTION' | translate }}</p>

  <!-- Boutons pour tester le changement instantané -->
  <div class="mt-4 space-x-2">
    <button (click)="changerLangue('fr')" class="bg-blue-500 text-white px-4 py-2 rounded">Français</button>
    <button (click)="changerLangue('en')" class="bg-gray-500 text-white px-4 py-2 rounded">English</button>
  </div>
</div>
