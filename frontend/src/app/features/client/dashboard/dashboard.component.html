<!-- Loading skeleton -->
<div class="dashboard-skeleton" *ngIf="isLoading">
  <div class="skeleton-banner"></div>
  <div class="skeleton-grid">
    <div class="skeleton-block tall"></div>
    <div class="skeleton-side">
      <div class="skeleton-block"></div>
      <div class="skeleton-block"></div>
    </div>
  </div>
  <div class="skeleton-transfers">
    <div class="skeleton-block card" *ngFor="let i of [1,2,3,4]"></div>
  </div>
</div>

<!-- Error state -->
<div class="dashboard-error" *ngIf="!isLoading && error">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
    fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" y1="8" x2="12" y2="12"/>
    <line x1="12" y1="16" x2="12.01" y2="16"/>
  </svg>
  <p>{{ error }}</p>
  <button (click)="ngOnInit()">Réessayer</button>
</div>

<!-- Dashboard content -->
<div class="dashboard-page" *ngIf="!isLoading && !error && data">

  <!-- Welcome banner -->
  <app-welcome-banner
    [userName]="data.userName"
    (sendMoneyClicked)="onSendMoney()"
    (historyClicked)="onViewHistory()"
  />

  <!-- Main grid: transfer card + side stats -->
  <div class="main-grid">
    <div class="transfer-col">
      <app-active-transfer-card
        *ngIf="data.activeTransfer"
        [transfer]="data.activeTransfer"
      />
      <div class="no-active-transfer" *ngIf="!data.activeTransfer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <p>Aucun transfert en cours</p>
      </div>
    </div>

    <div class="stats-col">
      <app-stats-card
        [sentThisMonth]="data.stats.sentThisMonth"
        [currency]="data.stats.currency"
        [changeVsLastMonth]="data.stats.changeVsLastMonth"
      />
      <app-beneficiaries-card
        [count]="data.stats.activeBeneficiariesCount"
        [beneficiaries]="data.stats.beneficiaries"
        (manageBeneficiaries)="onManageBeneficiaries()"
      />
    </div>
  </div>

  <!-- Recent transfers section -->
  <div class="recent-section">
    <app-recent-transfers
      [transfers]="data.recentTransfers"
      (viewAllClicked)="onViewAllTransfers()"
    />
  </div>

</div>
