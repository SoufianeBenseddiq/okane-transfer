<div class="recent-transfers">
  <div class="section-header">
    <div>
      <h2 class="section-title">Transferts récents</h2>
      <p class="section-subtitle">Vos {{ transfers.length }} derniers envois</p>
    </div>
    <button class="view-all" (click)="viewAllClicked.emit()">
      Voir tout l'historique →
    </button>
  </div>

  <div class="transfers-grid">
    <app-transfer-item-card
      *ngFor="let transfer of transfers"
      [transfer]="transfer"
    />
  </div>

  <div class="empty-state" *ngIf="transfers.length === 0">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
    </svg>
    <p>Aucun transfert récent</p>
    <span>Vos envois apparaîtront ici.</span>
  </div>
</div>
