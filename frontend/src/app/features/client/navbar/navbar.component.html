<nav class="flex items-center justify-between px-6 bg-white border-b border-gray-100" style="height:65px;">

  <!-- Logo -->
  <div class="flex items-center gap-2 flex-shrink-0">
    <div class="flex items-center justify-center rounded-[9px]" style="width:28px;height:28px;background:#1a1f36;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
        <path d="M5 10h11" stroke="#F5A623" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M10 4c0 6-3 10-5 12" stroke="#F5A623" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M14 7c2 2 4 5 4 9 0 2-1 4-3 4" stroke="#F5A623" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="18.5" cy="6" r="1.4" fill="#F5A623"/>
      </svg>
    </div>
    <span class="text-[16px] font-bold tracking-tight" style="color:#1a1f36;">
      Okane<span style="color:#F5A623;">Transfer</span>
    </span>
  </div>

  <!-- Nav Links -->
  <ul class="flex items-center gap-1 list-none m-0 p-0">
    <li *ngFor="let item of navItems">
      <a [routerLink]="item.route"
         routerLinkActive="active-link"
         [routerLinkActiveOptions]="{exact: item.exact}"
         class="nav-link px-4 py-2 rounded-full text-sm font-medium text-gray-600 cursor-pointer no-underline transition-all"
         style="font-size:14px;">
        {{ item.label | translate }}
      </a>
    </li>
  </ul>

  <!-- Right side -->
  <div class="flex items-center gap-3">

    <!-- Language switcher -->
    <div class="flex items-center gap-1 rounded-full px-2 py-1" style="background:#f5f5f5;">
      <button *ngFor="let lang of languages"
              (click)="switchLang(lang)"
              [class.active-lang]="currentLang === lang"
              class="lang-btn text-xs font-semibold px-2 py-0.5 rounded-full border-none cursor-pointer transition-all"
              style="font-size:11px;">
        {{ lang.toUpperCase() }}
      </button>
    </div>

    <!-- Notification bell -->
    <button class="relative flex items-center justify-center rounded-full border-none cursor-pointer bg-transparent"
            style="width:36px;height:36px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>

    <!-- Avatar + name -->
    <div class="flex items-center gap-2 cursor-pointer">
      <div class="flex items-center justify-center rounded-full text-white text-sm font-bold flex-shrink-0"
           style="width:34px;height:34px;background:#1a1f36;font-size:12px;">
        {{ initials }}
      </div>
      <span class="text-sm font-medium text-gray-700">{{ userName }}</span>
    </div>

  </div>
</nav>
<router-outlet></router-outlet>
