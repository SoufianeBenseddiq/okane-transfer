<!-- navbar.component.html -->
<nav class="navbar">
  <div class="navbar-content">

    <div class="navbar-left">
      <p class="nav-supertitle">MANAGER · AGENCE CASABLANCA MAARIF</p>
    </div>

    <div class="navbar-right">

      <!-- Export -->
      <button class="export-btn" (click)="exportReport()">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Exporter rapport
      </button>

      <!-- Bell -->
      <button class="notif-btn" title="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="notif-badge" *ngIf="notificationCount > 0">{{ notificationCount }}</span>
      </button>

      <!-- Language -->
      <div class="lang-group">
        <button
          *ngFor="let lang of languages"
          class="lang-btn"
          [class.active]="currentLanguage === lang"
          (click)="changeLanguage(lang)">
          {{ lang }}
        </button>
      </div>

      <!-- Avatar -->
      <button class="avatar-btn" title="Profil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </button>

      <!-- Logout -->
      <button class="logout-btn" (click)="logout()" title="Déconnexion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>

    </div>
  </div>
</nav>
