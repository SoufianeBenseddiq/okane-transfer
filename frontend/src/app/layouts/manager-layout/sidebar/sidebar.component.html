<!-- sidebar.component.html -->
<aside class="sidebar" [class.collapsed]="isCollapsed">

  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
        </svg>
      </div>
      <span class="logo-text" *ngIf="!isCollapsed">Okane<span class="logo-highlight">Transfer</span></span>
    </div>
    <button class="collapse-btn" (click)="toggleSidebar()">
      <svg *ngIf="!isCollapsed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      <svg *ngIf="isCollapsed"  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    <div class="menu-label" *ngIf="!isCollapsed">MENU</div>

    <a *ngFor="let item of menuItems"
       [routerLink]="item.route"
       [class.active]="isActive(item.route)"
       class="menu-item"
       [title]="item.label">

      <!-- Dashboard -->
      <svg *ngIf="item.icon === 'dashboard'" class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      <!-- Team -->
      <svg *ngIf="item.icon === 'team'" class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <!-- Shield -->
      <svg *ngIf="item.icon === 'shield'" class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <!-- Report -->
      <svg *ngIf="item.icon === 'report'" class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
      <!-- Gauge -->
      <svg *ngIf="item.icon === 'gauge'" class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/>
      </svg>
      <!-- Clock -->
      <svg *ngIf="item.icon === 'clock'" class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>

      <span class="menu-label-text" *ngIf="!isCollapsed">{{ item.label }}</span>
      <span class="menu-badge" *ngIf="item.badge && !isCollapsed">{{ item.badge }}</span>
    </a>
  </nav>

  <div class="sidebar-footer" *ngIf="!isCollapsed">
    <p>v1.0.0</p>
    <p>© 2026 Okane Transfer</p>
  </div>
</aside>
