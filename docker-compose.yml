services:
  mysql:
    image: mysql:8.0
    container_name: okane-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-Ab13122002}
      MYSQL_DATABASE: ${DB_NAME:-okane_transfer}
      MYSQL_USER: ${DB_USER:-okane_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-okane_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - okane-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: okane-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/okane_transfer
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-okane_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-okane_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-fdb501b55b32d91cbd5957beb846dea8}
      AES_SECRET_KEY: ${AES_SECRET_KEY:-fdb501b55b32d91cbd5957beb846dea8}
      AES_IV: ${AES_IV:-677722ca8f2f3a9c}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - okane-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: okane-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - okane-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  okane-network:
    driver: bridge
